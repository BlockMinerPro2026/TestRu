<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godot → APK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: #192235;
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 15px 50px #0008;
}

h1 {
  text-align: center;
  margin-top: 0;
}

input,
button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 12px;
  border: 0;
  font-size: 16px;
}

input {
  background: #27334a;
  color: white;
}

button {
  background: #35c759;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 20px;
  padding: 15px;
  background: #0d1320;
  border-radius: 12px;
  white-space: pre-wrap;
}

small {
  color: #aab4c7;
}
</style>
</head>

<body>

<div class="card">

<h1>🎮 Godot → APK</h1>

<p>
Загрузи ZIP Godot-проекта — GitHub Actions соберёт Android APK.
</p>

<input id="owner" placeholder="GitHub пользователь"
       value="nerpro2026">

<input id="repo" placeholder="Название репозитория"
       value="nerpro2026.github.io">

<input id="token"
       type="password"
       placeholder="GitHub Fine-grained Token">

<input id="project"
       type="file"
       accept=".zip">

<button id="build">
🚀 Собрать APK
</button>

<div id="status">
Готово к сборке.
</div>

</div>

<script>

const API = "https://api.github.com";

const statusBox = document.getElementById("status");
const buildButton = document.getElementById("build");

function status(text) {
  statusBox.textContent = text;
}

function headers(token) {
  return {
    "Accept": "application/vnd.github+json",
    "Authorization": "Bearer " + token,
    "X-GitHub-Api-Version": "2026-03-10"
  };
}

function base64(bytes) {

  let binary = "";

  const chunk = 0x8000;

  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(
      ...bytes.subarray(i, i + chunk)
    );
  }

  return btoa(binary);
}

async function github(url, options = {}) {

  const response = await fetch(API + url, options);

  if (!response.ok) {
    let message = "";

    try {
      const data = await response.json();
      message = data.message || "";
    } catch {}

    throw new Error(
      response.status + " " + message
    );
  }

  if (response.status === 204) {
    return null;
  }

  return response.json();
}

async function getRepo(owner, repo, token) {

  return github(
    `/repos/${owner}/${repo}`,
    {
      headers: headers(token)
    }
  );
}

async function uploadZip(
  owner,
  repo,
  branch,
  file,
  token
) {

  status("📦 Загружаю ZIP в GitHub...");

  const bytes = new Uint8Array(
    await file.arrayBuffer()
  );

  const content = base64(bytes);

  const path = ".github/apk-input/project.zip";

  let sha = null;

  const existing = await fetch(
    `${API}/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`,
    {
      headers: headers(token)
    }
  );

  if (existing.ok) {
    const data = await existing.json();
    sha = data.sha;
  }

  const body = {
    message: "Upload Godot project for APK build",
    content,
    branch
  };

  if (sha) {
    body.sha = sha;
  }

  await github(
    `/repos/${owner}/${repo}/contents/${path}`,
    {
      method: "PUT",
      headers: {
        ...headers(token),
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }
  );
}

async function startBuild(
  owner,
  repo,
  token
) {

  status("⚙️ Запускаю GitHub Actions...");

  await github(
    `/repos/${owner}/${repo}/dispatches`,
    {
      method: "POST",
      headers: {
        ...headers(token),
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        event_type: "build-apk"
      })
    }
  );
}

async function waitBuild(
  owner,
  repo,
  token
) {

  status("🔨 Сборка APK началась...\n\nЭто может занять несколько минут.");

  for (;;) {

    await new Promise(
      resolve => setTimeout(resolve, 5000)
    );

    const data = await github(
      `/repos/${owner}/${repo}/actions/runs?per_page=20`,
      {
        headers: headers(token)
      }
    );

    const workflow = data.workflow_runs.find(
      run =>
        run.name === "Build Android APK" &&
        (
          run.status === "queued" ||
          run.status === "in_progress" ||
          run.status === "completed"
        )
    );

    if (!workflow) {
      continue;
    }

    if (
      workflow.status === "queued" ||
      workflow.status === "in_progress"
    ) {

      status(
        "🔨 Сборка APK...\n\n" +
        "Статус: " +
        workflow.status
      );

      continue;
    }

    if (workflow.conclusion !== "success") {

      throw new Error(
        "GitHub Actions завершился: " +
        workflow.conclusion +
        "\n\nОткрой Actions в репозитории и посмотри ошибку."
      );
    }

    return workflow.id;
  }
}

async function getArtifact(
  owner,
  repo,
  runId,
  token
) {

  status("📦 Получаю готовый APK...");

  const data = await github(
    `/repos/${owner}/${repo}/actions/runs/${runId}/artifacts`,
    {
      headers: headers(token)
    }
  );

  const artifact = data.artifacts.find(
    a => a.name === "android-apk"
  );

  if (!artifact) {
    throw new Error(
      "APK-артефакт не найден."
    );
  }

  return artifact;
}

async function downloadArtifact(
  owner,
  repo,
  artifact,
  token
) {

  const response = await fetch(
    `${API}/repos/${owner}/${repo}/actions/artifacts/${artifact.id}/zip`,
    {
      headers: headers(token)
    }
  );

  if (!response.ok) {
    throw new Error(
      "Не удалось скачать APK."
    );
  }

  const blob = await response.blob();

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "farm-apk.zip";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}

buildButton.onclick = async () => {

  buildButton.disabled = true;

  try {

    const owner =
      document.getElementById("owner").value.trim();

    const repo =
      document.getElementById("repo").value.trim();

    const token =
      document.getElementById("token").value.trim();

    const file =
      document.getElementById("project").files[0];

    if (!owner || !repo) {
      throw new Error(
        "Укажи GitHub пользователя и репозиторий."
      );
    }

    if (!token) {
      throw new Error(
        "Введи GitHub Token."
      );
    }

    if (!file) {
      throw new Error(
        "Выбери ZIP Godot-проекта."
      );
    }

    if (!file.name.toLowerCase().endsWith(".zip")) {
      throw new Error(
        "Нужен ZIP-файл."
      );
    }

    status("🔎 Проверяю репозиторий...");

    const repository =
      await getRepo(owner, repo, token);

    const branch =
      repository.default_branch;

    await uploadZip(
      owner,
      repo,
      branch,
      file,
      token
    );

    await startBuild(
      owner,
      repo,
      token
    );

    const runId =
      await waitBuild(
        owner,
        repo,
        token
      );

    const artifact =
      await getArtifact(
        owner,
        repo,
        runId,
        token
      );

    await downloadArtifact(
      owner,
      repo,
      artifact,
      token
    );

    status(
      "✅ APK готов!\n\n" +
      "Скачан файл farm-apk.zip.\n" +
      "Внутри находится farm.apk."
    );

  } catch (error) {

    console.error(error);

    status(
      "❌ Ошибка:\n\n" +
      error.message
    );

  } finally {

    buildButton.disabled = false;
  }
};

</script>

</body>
</html>
