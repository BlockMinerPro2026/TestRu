<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Godot → APK</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #273b68, #0b1020 65%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 520px;
  padding: 28px;
  border-radius: 25px;
  background: rgba(24,31,52,.96);
  box-shadow: 0 20px 60px #0008;
}

h1 {
  text-align: center;
  margin: 0 0 10px;
}

.description {
  text-align: center;
  color: #aeb8cf;
  line-height: 1.5;
}

.file {
  margin-top: 25px;
  padding: 25px;
  border: 2px dashed #4c6fff;
  border-radius: 18px;
  text-align: center;
  cursor: pointer;
}

.file:hover {
  background: #ffffff08;
}

input[type=file] {
  display: none;
}

#fileName {
  margin-top: 12px;
  color: #65e58a;
  word-break: break-word;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 17px;
  margin-top: 20px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg,#36d66b,#159447);
  cursor: pointer;
}

button:disabled {
  opacity: .45;
}

.status {
  margin-top: 20px;
  padding: 16px;
  border-radius: 14px;
  background: #0b1120;
  white-space: pre-wrap;
  text-align: center;
}

.download {
  display: none;
  text-decoration: none;
  color: white;
  background: #3278ff;
  padding: 16px;
  margin-top: 15px;
  border-radius: 14px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

<h1>🎮 Godot → APK</h1>

<div class="description">
Загрузи ZIP своего Godot-проекта.<br>
Сайт автоматически запустит сборку Android APK.
</div>

<label class="file">

📦 Выбрать ZIP проекта

<input
  id="project"
  type="file"
  accept=".zip">

<div id="fileName">
ZIP не выбран
</div>

</label>

<button id="build">
🚀 СОБРАТЬ APK
</button>

<div id="status" class="status">
Готово к сборке.
</div>

<a
  id="download"
  class="download">
📥 Скачать APK
</a>

</div>

<script>

const API = "/api";

const fileInput =
  document.getElementById("project");

const fileName =
  document.getElementById("fileName");

const buildButton =
  document.getElementById("build");

const statusBox =
  document.getElementById("status");

const download =
  document.getElementById("download");

fileInput.addEventListener(
  "change",
  () => {

    if (!fileInput.files.length) {
      fileName.textContent =
        "ZIP не выбран";

      return;
    }

    fileName.textContent =
      fileInput.files[0].name;
  }
);

function status(text) {
  statusBox.textContent = text;
}

buildButton.onclick = async () => {

  download.style.display = "none";

  const file =
    fileInput.files[0];

  if (!file) {

    status(
      "❌ Сначала выбери ZIP Godot-проекта."
    );

    return;
  }

  if (
    !file.name
      .toLowerCase()
      .endsWith(".zip")
  ) {

    status(
      "❌ Можно загружать только ZIP."
    );

    return;
  }

  buildButton.disabled = true;

  status(
    "📤 Загружаю проект...\n\n" +
    "Пожалуйста, подожди."
  );

  try {

    const form =
      new FormData();

    form.append(
      "project",
      file
    );

    const response =
      await fetch(
        API + "/build",
        {
          method: "POST",
          body: form
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Ошибка сервера"
      );
    }

    const jobId =
      data.jobId;

    status(
      "🔨 Сборка APK запущена...\n\n" +
      "ID: " + jobId
    );

    await waitForBuild(jobId);

  } catch (error) {

    console.error(error);

    status(
      "❌ Ошибка:\n\n" +
      error.message
    );

  } finally {

    buildButton.disabled = false;
  }
};

async function waitForBuild(jobId) {

  while (true) {

    await new Promise(
      resolve =>
        setTimeout(resolve, 5000)
    );

    const response =
      await fetch(
        API +
        "/build/" +
        encodeURIComponent(jobId)
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Ошибка проверки сборки"
      );
    }

    if (data.status === "queued") {

      status(
        "⏳ APK ожидает запуска..."
      );

      continue;
    }

    if (data.status === "building") {

      status(
        "🔨 Godot собирает APK...\n\n" +
        "Обычно это занимает несколько минут."
      );

      continue;
    }

    if (data.status === "success") {

      status(
        "✅ APK готов!\n\n" +
        "Нажми кнопку ниже."
      );

      download.href =
        data.download;

      download.style.display =
        "block";

      return;
    }

    if (data.status === "failed") {

      throw new Error(
        data.error ||
        "GitHub Actions завершился с ошибкой."
      );
    }
  }
}

</script>

</body>
</html>
