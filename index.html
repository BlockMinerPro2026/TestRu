<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover"
>

<title>Air Draw</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
}

/* =====================================================
   CAMERA
===================================================== */

#video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

  background: #000;

  z-index: 1;
}


/* =====================================================
   DRAW CANVAS
===================================================== */

#canvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

  transform: scaleX(-1);

  z-index: 5;
}


/* =====================================================
   FINGER POINTER
===================================================== */

#fingerPoint {

  position: absolute;

  width: 18px;
  height: 18px;

  margin-left: -9px;
  margin-top: -9px;

  border-radius: 50%;

  border: 2px solid white;

  pointer-events: none;

  z-index: 20;

  display: none;

  box-shadow:
    0 0 5px white,
    0 0 18px currentColor;

}


/* =====================================================
   TOP UI
===================================================== */

#topBar {

  position: absolute;

  top: env(safe-area-inset-top, 10px);

  left: 10px;
  right: 10px;

  z-index: 50;

  display: flex;

  justify-content: space-between;

  pointer-events: none;
}


.panel {

  display: flex;

  align-items: center;

  gap: 7px;

  padding: 7px;

  border-radius: 18px;

  background: rgba(0,0,0,.45);

  backdrop-filter: blur(12px);

  -webkit-backdrop-filter: blur(12px);

  pointer-events: auto;
}


button {

  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 14px;

  background: rgba(255,255,255,.15);

  color: white;

  font-size: 18px;

}


button:active {

  transform: scale(.9);

}


.color {

  width: 30px;
  height: 30px;

  min-width: 30px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.5);

}


.color.active {

  border: 3px solid white;

  box-shadow:
    0 0 7px white,
    0 0 15px white;

}


#white {
  background: white;
}

#red {
  background: #ff1744;
}

#blue {
  background: #2979ff;
}

#green {
  background: #00ff88;
}

#yellow {
  background: #ffe600;
}


/* =====================================================
   STATUS
===================================================== */

#status {

  position: absolute;

  z-index: 50;

  left: 50%;

  bottom:
    calc(
      env(safe-area-inset-bottom, 10px)
      + 14px
    );

  transform: translateX(-50%);

  padding: 9px 16px;

  border-radius: 20px;

  color: white;

  background: rgba(0,0,0,.5);

  backdrop-filter: blur(10px);

  font-size: 14px;

  white-space: nowrap;
}


/* =====================================================
   START SCREEN
===================================================== */

#startScreen {

  position: absolute;

  inset: 0;

  z-index: 100;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 30px;

  color: white;

  background: #050505;

  text-align: center;
}


#startScreen h1 {

  margin: 0 0 10px;

  font-size: 34px;

}


#startScreen p {

  max-width: 360px;

  line-height: 1.5;

  opacity: .7;

}


#startButton {

  width: auto;
  height: auto;

  margin-top: 20px;

  padding: 15px 28px;

  border-radius: 30px;

  background: white;

  color: black;

  font-size: 17px;

  font-weight: bold;

}


#startButton:disabled {

  opacity: .5;

}


#error {

  margin-top: 15px;

  max-width: 360px;

  color: #ff5570;

  line-height: 1.4;

}


/* =====================================================
   GESTURE HELP
===================================================== */

#help {

  position: absolute;

  z-index: 40;

  left: 50%;

  top: 50%;

  transform: translate(-50%, -50%);

  color: white;

  background: rgba(0,0,0,.45);

  padding: 15px 20px;

  border-radius: 20px;

  text-align: center;

  pointer-events: none;

  opacity: 0;

  transition: opacity .2s;

}


</style>

</head>

<body>


<div id="app">


  <!-- CAMERA -->

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>


  <!-- DRAWING -->

  <canvas id="canvas"></canvas>


  <!-- POINTER -->

  <div id="fingerPoint"></div>


  <!-- TOP -->

  <div id="topBar">


    <div class="panel">

      <button
        class="color active"
        data-color="#ffffff"
        id="white">
      </button>

      <button
        class="color"
        data-color="#ff1744"
        id="red">
      </button>

      <button
        class="color"
        data-color="#2979ff"
        id="blue">
      </button>

      <button
        class="color"
        data-color="#00ff88"
        id="green">
      </button>

      <button
        class="color"
        data-color="#ffe600"
        id="yellow">
      </button>

    </div>


    <div class="panel">

      <button id="clearButton">
        🗑
      </button>

      <button id="saveButton">
        📸
      </button>

    </div>


  </div>


  <!-- STATUS -->

  <div id="status">
    Нажми «Запустить камеру»
  </div>


  <!-- HELP -->

  <div id="help">
    ☝️ Рисовать<br>
    ✌️ Ластик<br>
    🤟 Стереть всё
  </div>


  <!-- START -->

  <div id="startScreen">

    <h1>✨ Air Draw</h1>

    <p>
      Покажи руку камере.
      <br><br>
      ☝️ 1 палец — рисовать<br>
      ✌️ 2 пальца — ластик<br>
      🤟 3 пальца — стереть всё
    </p>


    <button id="startButton">
      Запустить камеру
    </button>


    <div id="error"></div>

  </div>


</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d", {
    alpha: true
  });

const fingerPoint =
  document.getElementById("fingerPoint");

const status =
  document.getElementById("status");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const errorBox =
  document.getElementById("error");

const help =
  document.getElementById("help");


/* =====================================================
   STATE
===================================================== */

let currentColor = "#ffffff";

let drawing = false;

let erasing = false;

let lastX = null;

let lastY = null;

let processing = false;

let cameraStarted = false;


/*
  Защита от многократного
  срабатывания "3 пальца".
*/

let clearCooldown = false;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas() {

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const w =
    window.innerWidth;

  const h =
    window.innerHeight;


  canvas.width =
    Math.round(w * dpr);

  canvas.height =
    Math.round(h * dpr);


  canvas.style.width =
    w + "px";

  canvas.style.height =
    h + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";
}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   COLORS
===================================================== */

document
  .querySelectorAll(".color")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".color")
          .forEach(b => {
            b.classList.remove("active");
          });


        button.classList.add("active");


        currentColor =
          button.dataset.color;


        fingerPoint.style.color =
          currentColor;

      }
    );

  });


/* =====================================================
   CLEAR BUTTON
===================================================== */

function clearDrawing() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  drawing = false;

  lastX = null;

  lastY = null;
}


document
  .getElementById("clearButton")
  .addEventListener(
    "click",
    clearDrawing
  );


/* =====================================================
   DISTANCE
===================================================== */

function distance(a, b) {

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  const dz =
    (a.z || 0) -
    (b.z || 0);


  return Math.sqrt(
    dx * dx +
    dy * dy +
    dz * dz
  );
}


/* =====================================================
   ANGLE
===================================================== */

function angle(a, b, c) {

  const abx =
    a.x - b.x;

  const aby =
    a.y - b.y;

  const cbx =
    c.x - b.x;

  const cby =
    c.y - b.y;


  const dot =
    abx * cbx +
    aby * cby;


  const len1 =
    Math.sqrt(
      abx * abx +
      aby * aby
    );


  const len2 =
    Math.sqrt(
      cbx * cbx +
      cby * cby
    );


  if (
    len1 === 0 ||
    len2 === 0
  ) {
    return 0;
  }


  let cosine =
    dot / (len1 * len2);


  cosine =
    Math.max(
      -1,
      Math.min(1, cosine)
    );


  return (
    Math.acos(cosine) *
    180 /
    Math.PI
  );
}


/* =====================================================
   FINGER DETECTION
===================================================== */

/*
  Проверка обычного пальца.

  tip = кончик
  pip = средний сустав
  mcp = основание
*/

function isFingerUp(
  lm,
  tip,
  pip,
  mcp
) {

  const tipPoint =
    lm[tip];

  const pipPoint =
    lm[pip];

  const mcpPoint =
    lm[mcp];


  /*
    Палец должен быть достаточно
    длинным относительно ладони.
  */

  const length =
    distance(
      tipPoint,
      mcpPoint
    );


  const palm =
    distance(
      lm[0],
      lm[9]
    );


  /*
    Проверяем прямоту пальца.
  */

  const straight =
    angle(
      tipPoint,
      pipPoint,
      mcpPoint
    );


  /*
    Дополнительно смотрим,
    находится ли кончик дальше
    от запястья, чем сустав.
  */

  const tipFromWrist =
    distance(
      tipPoint,
      lm[0]
    );


  const pipFromWrist =
    distance(
      pipPoint,
      lm[0]
    );


  return (

    length >
    palm * 0.48

    &&

    straight >
    135

    &&

    tipFromWrist >
    pipFromWrist * 1.03

  );
}


/*
  Большой палец.

  Для жестов нам достаточно
  относительно простой проверки.
*/

function isThumbUp(lm) {

  const tip =
    lm[4];

  const ip =
    lm[3];

  const mcp =
    lm[2];


  const palm =
    distance(
      lm[0],
      lm[9]
    );


  const length =
    distance(
      tip,
      mcp
    );


  const straight =
    angle(
      tip,
      ip,
      mcp
    );


  return (
    length >
    palm * 0.40
    &&
    straight >
    125
  );
}


/* =====================================================
   COUNT FINGERS
===================================================== */

function getFingerState(lm) {

  const thumb =
    isThumbUp(lm);

  const index =
    isFingerUp(
      lm,
      8,
      7,
      5
    );

  const middle =
    isFingerUp(
      lm,
      12,
      11,
      9
    );

  const ring =
    isFingerUp(
      lm,
      16,
      15,
      13
    );

  const pinky =
    isFingerUp(
      lm,
      20,
      19,
      17
    );


  return {
    thumb,
    index,
    middle,
    ring,
    pinky,

    count:
      Number(thumb) +
      Number(index) +
      Number(middle) +
      Number(ring) +
      Number(pinky)
  };
}


/* =====================================================
   SCREEN COORDINATES
===================================================== */

/*
  Это самая важная часть
  для совпадения пальца и рисунка.

  Видео:

      object-fit: cover

  Поэтому сначала рассчитываем,
  как именно браузер растянул
  исходное видео на экран.
*/

function landmarkToScreen(
  landmark
) {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;


  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if (
    !vw ||
    !vh
  ) {
    return null;
  }


  /*
    Масштаб cover.
  */

  const scale =
    Math.max(
      sw / vw,
      sh / vh
    );


  const displayWidth =
    vw * scale;

  const displayHeight =
    vh * scale;


  /*
    Излишек изображения,
    который обрезается.
  */

  const cropX =
    (
      displayWidth -
      sw
    ) / 2;


  const cropY =
    (
      displayHeight -
      sh
    ) / 2;


  /*
    Видео зеркальное,
    поэтому X переворачиваем.
  */

  const x =
    (1 - landmark.x) *
    displayWidth -
    cropX;


  const y =
    landmark.y *
    displayHeight -
    cropY;


  return {
    x,
    y
  };
}


/* =====================================================
   DRAW
===================================================== */

function drawLine(
  x1,
  y1,
  x2,
  y2
) {

  const dx =
    x2 - x1;

  const dy =
    y2 - y1;


  const d =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  /*
    Если MediaPipe вдруг
    потерял руку и координата
    прыгнула далеко — не рисуем
    огромную линию.
  */

  if (d > 180) {

    lastX = x2;

    lastY = y2;

    return;
  }


  /*
    ЛАСТИК
  */

  if (erasing) {

    ctx.save();

    ctx.globalCompositeOperation =
      "destination-out";

    ctx.lineWidth =
      45;

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.stroke();

    ctx.restore();

    return;
  }


  /*
    РИСОВАНИЕ
  */

  ctx.save();

  ctx.globalCompositeOperation =
    "source-over";


  /*
    Светящееся свечение.
  */

  ctx.strokeStyle =
    currentColor;

  ctx.lineWidth =
    7;

  ctx.shadowColor =
    currentColor;

  ctx.shadowBlur =
    20;


  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();


  ctx.restore();


  /*
    Яркое ядро.
  */

  ctx.save();

  ctx.strokeStyle =
    currentColor;

  ctx.lineWidth =
    2.5;

  ctx.shadowBlur =
    0;


  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();


  ctx.restore();
}


/* =====================================================
   MEDIA PIPE
===================================================== */

const hands =
  new Hands({

    locateFile: file => {

      return (
        "https://cdn.jsdelivr.net/npm/" +
        "@mediapipe/hands/" +
        file
      );

    }

  });


hands.setOptions({

  /*
    0 быстрее на телефоне.
  */

  modelComplexity: 0,

  maxNumHands: 1,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


/* =====================================================
   RESULTS
===================================================== */

hands.onResults(
  results => {

    /*
      Рука не найдена.
    */

    if (
      !results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0
    ) {

      status.textContent =
        "Покажи руку";

      fingerPoint.style.display =
        "none";

      drawing = false;

      erasing = false;

      lastX = null;

      lastY = null;

      return;
    }


    const lm =
      results.multiHandLandmarks[0];


    const fingers =
      getFingerState(lm);


    const count =
      fingers.count;


    /*
      Координата указательного
      пальца.

      Даже когда показываем
      2 пальца, он остаётся
      первым пальцем.
    */

    const point =
      landmarkToScreen(
        lm[8]
      );


    if (!point) {
      return;
    }


    /*
      Показываем точку
      непосредственно на кончике
      указательного пальца.
    */

    fingerPoint.style.display =
      "block";

    fingerPoint.style.left =
      point.x + "px";

    fingerPoint.style.top =
      point.y + "px";


    /* =================================================
       3 ПАЛЬЦА = СТЕРЕТЬ ВСЁ
    ================================================= */

    if (count === 3) {

      status.textContent =
        "🤟 Стереть всё";


      drawing = false;

      erasing = false;

      lastX = null;

      lastY = null;


      /*
        Очищаем только один раз,
        пока человек держит 3 пальца.
      */

      if (!clearCooldown) {

        clearDrawing();

        clearCooldown = true;

      }


      return;
    }


    /*
      Если количество стало не 3,
      разрешаем следующее срабатывание.
    */

    if (count !== 3) {

      clearCooldown = false;

    }


    /* =================================================
       2 ПАЛЬЦА = ЛАСТИК
    ================================================= */

    if (count === 2) {

      status.textContent =
        "✌️ Ластик";


      erasing = true;

      drawing = true;


      /*
        Первый кадр ластика.
      */

      if (
        lastX === null ||
        lastY === null
      ) {

        lastX =
          point.x;

        lastY =
          point.y;

        return;
      }


      drawLine(
        lastX,
        lastY,
        point.x,
        point.y
      );


      lastX =
        point.x;

      lastY =
        point.y;


      return;
    }


    /* =================================================
       1 ПАЛЕЦ = РИСОВАНИЕ
    ================================================= */

    if (
      count === 1 &&
      fingers.index
    ) {

      status.textContent =
        "☝️ Рисую";


      erasing = false;


      /*
        Начало новой линии.
      */

      if (
        lastX === null ||
        lastY === null ||
        !drawing
      ) {

        drawing = true;

        lastX =
          point.x;

        lastY =
          point.y;


        /*
          Точка старта.
        */

        ctx.save();

        ctx.fillStyle =
          currentColor;

        ctx.shadowColor =
          currentColor;

        ctx.shadowBlur =
          18;


        ctx.beginPath();

        ctx.arc(
          point.x,
          point.y,
          3,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.restore();


        return;
      }


      /*
        Никакого сглаживания.

        Рисуем прямо от предыдущей
        координаты к текущей.
      */

      drawLine(
        lastX,
        lastY,
        point.x,
        point.y
      );


      lastX =
        point.x;

      lastY =
        point.y;


      return;
    }


    /* =================================================
       0 / 4 / 5 ПАЛЬЦЕВ
    ================================================= */

    status.textContent =
      `Пальцев: ${count}`;


    drawing = false;

    erasing = false;

    lastX = null;

    lastY = null;

  }
);


/* =====================================================
   CAMERA PROCESSING
===================================================== */

async function processFrame() {

  if (
    !processing &&
    video.readyState >= 2
  ) {

    processing = true;


    try {

      await hands.send({
        image: video
      });

    } catch (error) {

      console.error(
        "Ошибка MediaPipe:",
        error
      );

    }


    processing = false;
  }


  requestAnimationFrame(
    processFrame
  );
}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  /*
    Не разрешаем нажимать кнопку
    несколько раз.
  */

  if (cameraStarted) {
    return;
  }


  errorBox.textContent =
    "";

  status.textContent =
    "Запрашиваю камеру…";


  startButton.disabled =
    true;


  try {

    /*
      Проверяем поддержку камеры.
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Браузер не поддерживает камеру. Открой страницу через HTTPS."
      );

    }


    /*
      Сначала пробуем фронтальную
      камеру.
    */

    try {

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: {

              facingMode: {
                ideal: "user"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              },

              frameRate: {
                ideal: 60,
                max: 60
              }

            },

            audio: false

          });

    } catch (firstError) {

      /*
        Если настройки выше не подошли,
        пробуем самый простой вариант.
      */

      console.warn(
        "Первая попытка камеры не удалась:",
        firstError
      );


      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: true,

            audio: false

          });

    }


    /*
      Передаём поток видео.
    */

    video.srcObject =
      stream;


    /*
      Ждём загрузки видео.
    */

    await new Promise(
      resolve => {

        if (
          video.readyState >= 1 &&
          video.videoWidth > 0
        ) {

          resolve();

          return;
        }


        video.onloadedmetadata =
          () => {

            resolve();

          };

      }
    );


    /*
      Явно запускаем видео.
    */

    await video.play();


    /*
      Проверяем, что камера реально
      начала отдавать кадры.
    */

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      throw new Error(
        "Камера запустилась, но видеопоток не отдаёт изображение."
      );

    }


    cameraStarted =
      true;


    /*
      Убираем стартовый экран.
    */

    startScreen.style.display =
      "none";


    status.textContent =
      "Покажи ☝️";


    /*
      Запускаем распознавание.
    */

    requestAnimationFrame(
      processFrame
    );


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    /*
      Останавливаем поток,
      если он успел открыться.
    */

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      stream = null;
    }


    startButton.disabled =
      false;


    status.textContent =
      "Камера не запущена";


    /*
      Понятная ошибка пользователю.
    */

    if (
      error.name ===
      "NotAllowedError"
    ) {

      errorBox.textContent =
        "Доступ к камере запрещён. " +
        "Разреши камеру для этого сайта в настройках браузера.";

    } else if (
      error.name ===
      "NotFoundError"
    ) {

      errorBox.textContent =
        "Камера не найдена на устройстве.";

    } else if (
      error.name ===
      "NotReadableError"
    ) {

      errorBox.textContent =
        "Камера занята другим приложением.";

    } else {

      errorBox.textContent =
        "Не удалось запустить камеру: " +
        error.message;

    }

  }

}


/* =====================================================
   SAVE IMAGE
===================================================== */

document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    () => {

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {
        return;
      }


      const result =
        document.createElement(
          "canvas"
        );


      result.width =
        video.videoWidth;

      result.height =
        video.videoHeight;


      const rctx =
        result.getContext("2d");


      /*
        Зеркальная камера.
      */

      rctx.save();

      rctx.translate(
        result.width,
        0
      );

      rctx.scale(
        -1,
        1
      );


      rctx.drawImage(
        video,
        0,
        0,
        result.width,
        result.height
      );


      rctx.restore();


      /*
        Рисунок.
      */

      rctx.drawImage(
        canvas,
        0,
        0,
        result.width,
        result.height
      );


      const link =
        document.createElement(
          "a"
        );


      link.download =
        "air-drawing.png";


      link.href =
        result.toDataURL(
          "image/png"
        );


      link.click();

    }
  );


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
  "click",
  startCamera
);

</script>
