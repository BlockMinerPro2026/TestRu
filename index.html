<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Air Drawing</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    #ui {
      position: absolute;
      z-index: 10;
      top: env(safe-area-inset-top, 15px);
      left: 0;
      right: 0;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .panel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    button {
      border: 0;
      color: white;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      min-width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
    }

    button.active {
      box-shadow: 0 0 0 2px white inset;
    }

    .color {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
    }

    #red {
      background: #ff304f;
    }

    #blue {
      background: #3080ff;
    }

    #green {
      background: #00ff88;
    }

    #yellow {
      background: #ffe600;
    }

    #white {
      background: white;
    }

    #status {
      position: absolute;
      z-index: 10;
      bottom: calc(env(safe-area-inset-bottom, 15px) + 15px);
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
      font-size: 14px;
    }

    #startScreen {
      position: absolute;
      z-index: 20;
      inset: 0;
      background: #050505;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    #startScreen h1 {
      font-size: 32px;
      margin: 0 0 12px;
    }

    #startScreen p {
      opacity: 0.7;
      max-width: 350px;
      line-height: 1.5;
    }

    #startButton {
      margin-top: 20px;
      padding: 14px 24px;
      height: auto;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
    }

    #error {
      color: #ff5c75;
      margin-top: 15px;
      max-width: 350px;
    }
  </style>
</head>

<body>

<div id="container">

  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="ui">

    <div class="panel">
      <button class="color active" id="white" data-color="#ffffff"></button>
      <button class="color" id="red" data-color="#ff304f"></button>
      <button class="color" id="blue" data-color="#3080ff"></button>
      <button class="color" id="green" data-color="#00ff88"></button>
      <button class="color" id="yellow" data-color="#ffe600"></button>
    </div>

    <div class="panel">
      <button id="clear">🗑️</button>
      <button id="save">📸</button>
    </div>

  </div>

  <div id="status">Покажи указательный палец ☝️</div>

  <div id="startScreen">
    <h1>✨ Air Drawing</h1>
    <p>
      Разреши доступ к камере и рисуй указательным пальцем прямо в воздухе.
    </p>

    <button id="startButton">Запустить камеру</button>

    <div id="error"></div>
  </div>

</div>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const startScreen = document.getElementById("startScreen");
  const startButton = document.getElementById("startButton");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  let currentColor = "#ffffff";
  let drawing = false;
  let lastX = null;
  let lastY = null;

  // Настройки кисти
  const brushSize = 7;
  const glowSize = 25;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // -----------------------------
  // Цвет кисти
  // -----------------------------

  document.querySelectorAll(".color").forEach(button => {
    button.addEventListener("click", () => {

      document
        .querySelectorAll(".color")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");

      currentColor = button.dataset.color;
    });
  });

  // -----------------------------
  // Очистить рисунок
  // -----------------------------

  document.getElementById("clear").addEventListener("click", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    lastX = null;
    lastY = null;
    drawing = false;
  });

  // -----------------------------
  // Сохранить изображение
  // -----------------------------

  document.getElementById("save").addEventListener("click", () => {

    const result = document.createElement("canvas");

    result.width = video.videoWidth || window.innerWidth;
    result.height = video.videoHeight || window.innerHeight;

    const rctx = result.getContext("2d");

    // Камера
    rctx.save();
    rctx.translate(result.width, 0);
    rctx.scale(-1, 1);

    rctx.drawImage(
      video,
      0,
      0,
      result.width,
      result.height
    );

    rctx.restore();

    // Рисунок
    rctx.drawImage(
      canvas,
      0,
      0,
      result.width,
      result.height
    );

    const link = document.createElement("a");
    link.download = "air-drawing.png";
    link.href = result.toDataURL("image/png");

    link.click();
  });

  // -----------------------------
  // MediaPipe Hands
  // -----------------------------

  const hands = new Hands({
    locateFile: file => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  hands.onResults(results => {

    if (!results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0) {

      status.textContent = "Покажи руку ☝️";

      drawing = false;
      lastX = null;
      lastY = null;

      return;
    }

    const landmarks = results.multiHandLandmarks[0];

    /*
      MediaPipe:
      8 = кончик указательного пальца
      6 = средняя фаланга указательного пальца
      5 = основание указательного пальца
    */

    const tip = landmarks[8];
    const pip = landmarks[6];
    const mcp = landmarks[5];

    /*
      Проверяем, поднят ли указательный палец.
      Координата Y меньше = палец выше.
    */

    const indexIsUp =
      tip.y < pip.y &&
      pip.y < mcp.y;

    if (!indexIsUp) {

      status.textContent = "Подними указательный палец ☝️";

      drawing = false;
      lastX = null;
      lastY = null;

      return;
    }

    status.textContent = "Рисую ✨";

    /*
      Видео зеркальное.
      Поэтому X инвертируем.
    */

    const x = (1 - tip.x) * canvas.width;
    const y = tip.y * canvas.height;

    if (!drawing) {
      lastX = x;
      lastY = y;
      drawing = true;
      return;
    }

    drawLine(lastX, lastY, x, y);

    lastX = x;
    lastY = y;
  });

  // -----------------------------
  // Рисование
  // -----------------------------

  function drawLine(x1, y1, x2, y2) {

    // Свечение
    ctx.save();

    ctx.shadowBlur = glowSize;
    ctx.shadowColor = currentColor;

    ctx.strokeStyle = currentColor;
    ctx.lineWidth = brushSize;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();

    // Яркое ядро линии
    ctx.save();

    ctx.strokeStyle = currentColor;
    ctx.lineWidth = brushSize / 2;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();
  }

  // -----------------------------
  // Запуск камеры
  // -----------------------------

  async function startCamera() {

    errorBox.textContent = "";

    try {

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "user"
          },
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },
        audio: false
      });

      video.srcObject = stream;

      await video.play();

      startScreen.style.display = "none";

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({
            image: video
          });
        },
        width: 1280,
        height: 720
      });

      camera.start();

    } catch (error) {

      console.error(error);

      errorBox.textContent =
        "Не удалось получить доступ к камере. Проверь разрешение камеры и открой страницу через HTTPS.";

    }
  }

  startButton.addEventListener("click", startCamera);

</script>

</body>
</html>
