<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no"
>

<title>Emoji Camera</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#camera {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

  background: #111;
}

#canvas {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;
}

.ui {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  padding:
    20px
    20px
    calc(20px + env(safe-area-inset-bottom));

  display: flex;
  justify-content: center;

  pointer-events: none;
}

button {
  pointer-events: auto;

  border: none;

  padding: 15px 24px;

  border-radius: 999px;

  background: rgba(255,255,255,.9);

  color: #111;

  font-size: 16px;
  font-weight: bold;

  box-shadow:
    0 8px 30px rgba(0,0,0,.35);
}

#status {
  position: fixed;

  top: calc(15px + env(safe-area-inset-top));
  left: 50%;

  transform: translateX(-50%);

  padding: 8px 14px;

  border-radius: 999px;

  background: rgba(0,0,0,.45);

  color: white;

  font-size: 13px;

  backdrop-filter: blur(10px);

  white-space: nowrap;
}
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline
></video>

<canvas id="canvas"></canvas>

<div id="status">
  Запускаем камеру...
</div>

<div class="ui">
  <button id="switch">
    🔄 Перевернуть камеру
  </button>
</div>


<script>

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const switchButton =
  document.getElementById("switch");


let stream = null;

let currentCamera = "user";

let emojiX = 0.5;
let emojiY = 0.42;

let emojiWidth = 170;

let dragging = false;

let detector = null;


/*
========================================
КАМЕРА
========================================
*/

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: currentCamera,

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });

    video.srcObject = stream;

    await video.play();

    status.textContent =
      "😃 Камера включена";

    setupDetector();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Не удалось открыть камеру";

  }

}


/*
========================================
FACE DETECTOR
========================================
*/

async function setupDetector() {

  /*
    FaceDetector есть не во всех браузерах.
  */

  if ("FaceDetector" in window) {

    try {

      detector =
        new FaceDetector({
          fastMode: true,
          maxDetectedFaces: 1
        });

      status.textContent =
        "😃 Поиск лица...";

    } catch {

      detector = null;

    }

  } else {

    detector = null;

    status.textContent =
      "😃 Перетащи фильтр пальцем";

  }

}


/*
========================================
CANVAS
========================================
*/

function resizeCanvas() {

  canvas.width =
    window.innerWidth *
    devicePixelRatio;

  canvas.height =
    window.innerHeight *
    devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/*
========================================
РИСУЕМ ФИЛЬТР
========================================
*/

function drawEmoji(x, y, width) {

  const height =
    width * 0.65;

  const left =
    x - width / 2;

  const top =
    y - height / 2;


  /*
    Фиолетовая рамка
  */

  ctx.save();

  ctx.translate(
    left + width / 2,
    top + height / 2
  );


  /*
    Небольшой наклон
    для эффекта из видео
  */

  ctx.rotate(
    Math.sin(Date.now() / 700) * 0.025
  );


  ctx.translate(
    -width / 2,
    -height / 2
  );


  /*
    Свечение
  */

  ctx.shadowColor =
    "rgba(140,0,255,.8)";

  ctx.shadowBlur = 20;


  /*
    Фиолетовый прямоугольник
  */

  ctx.fillStyle =
    "rgba(122,20,180,.82)";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.shadowBlur = 0;


  /*
    Рамка
  */

  ctx.strokeStyle =
    "#d54cff";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    2,
    2,
    width - 4,
    height - 4
  );


  /*
    Смайлик 😃
  */

  ctx.font =
    `${height * .72}px Arial`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillStyle =
    "#ffd83d";

  ctx.fillText(
    "😃",
    width / 2,
    height / 2 + 2
  );


  ctx.restore();

}


/*
========================================
ПОИСК ЛИЦА
========================================
*/

async function detectFace() {

  if (
    !detector ||
    video.readyState < 2
  ) {

    drawEmoji(
      window.innerWidth * emojiX,
      window.innerHeight * emojiY,
      emojiWidth
    );

    requestAnimationFrame(detectFace);

    return;

  }


  try {

    const faces =
      await detector.detect(video);


    if (faces.length > 0) {

      const box =
        faces[0].boundingBox;


      /*
        Координаты видео.

        Переводим их
        в координаты экрана.
      */

      const videoWidth =
        video.videoWidth;

      const videoHeight =
        video.videoHeight;


      const screenWidth =
        window.innerWidth;

      const screenHeight =
        window.innerHeight;


      const scale =
        Math.max(
          screenWidth / videoWidth,
          screenHeight / videoHeight
        );


      const displayedWidth =
        videoWidth * scale;

      const displayedHeight =
        videoHeight * scale;


      const offsetX =
        (screenWidth -
          displayedWidth) / 2;

      const offsetY =
        (screenHeight -
          displayedHeight) / 2;


      /*
        Центр лица
      */

      let faceX =
        box.x +
        box.width / 2;

      let faceY =
        box.y +
        box.height / 2;


      faceX =
        faceX * scale +
        offsetX;

      faceY =
        faceY * scale +
        offsetY;


      /*
        Видео зеркальное,
        поэтому X переворачиваем.
      */

      faceX =
        screenWidth - faceX;


      emojiX =
        faceX / screenWidth;

      emojiY =
        faceY / screenHeight;


      emojiWidth =
        Math.max(
          120,
          box.width * scale * 1.35
        );


      status.textContent =
        "😃 Лицо найдено";

    }


  } catch (error) {

    console.log(error);

  }


  /*
    Рисуем
  */

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  drawEmoji(
    window.innerWidth * emojiX,
    window.innerHeight * emojiY,
    emojiWidth
  );


  requestAnimationFrame(detectFace);

}


/*
========================================
ПЕРЕМЕЩЕНИЕ ПАЛЬЦЕМ
========================================
*/

function moveEmoji(clientX, clientY) {

  emojiX =
    clientX /
    window.innerWidth;

  emojiY =
    clientY /
    window.innerHeight;

}


/*
    Если FaceDetector отсутствует,
    фильтр можно двигать пальцем.
*/

canvas.addEventListener(
  "pointerdown",
  e => {

    dragging = true;

    moveEmoji(
      e.clientX,
      e.clientY
    );

  }
);

canvas.addEventListener(
  "pointermove",
  e => {

    if (!dragging) return;

    moveEmoji(
      e.clientX,
      e.clientY
    );

  }
);

canvas.addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);


/*
========================================
ПЕРЕКЛЮЧЕНИЕ КАМЕРЫ
========================================
*/

switchButton.addEventListener(
  "click",
  async () => {

    currentCamera =
      currentCamera === "user"
        ? "environment"
        : "user";


    /*
      Зеркалим только
      фронтальную камеру.
    */

    video.style.transform =
      currentCamera === "user"
        ? "scaleX(-1)"
        : "scaleX(1)";


    await startCamera();

  }
);


/*
========================================
ЗАПУСК
========================================
*/

startCamera();

</script>

</body>
</html>
