<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Face Filter</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #111;
}

#overlay {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    touch-action: none;
}

#message {
    position: fixed;

    top: calc(15px + env(safe-area-inset-top));
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 9px 15px;

    border-radius: 30px;

    color: white;
    background: rgba(0,0,0,.55);

    font-size: 13px;

    white-space: nowrap;

    backdrop-filter: blur(10px);
}

.controls {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 20;

    padding:
        15px
        15px
        calc(15px + env(safe-area-inset-bottom));

    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    border: 0;

    border-radius: 999px;

    padding: 14px 20px;

    background: white;
    color: black;

    font-size: 15px;
    font-weight: 700;
}

button:active {
    transform: scale(.96);
}

#start {
    background: #8b35ff;
    color: white;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="overlay"></canvas>

<div id="message">
    Нажми «Запустить камеру»
</div>

<div class="controls">

    <button id="start">
        📷 Запустить камеру
    </button>

    <button id="flip">
        🔄
    </button>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("start");

const flipButton =
    document.getElementById("flip");


let stream = null;

let camera = "user";

let detector = null;

let faceDetected = false;


/*
========================================
ПОЛОЖЕНИЕ ФИЛЬТРА
========================================
*/

let filterX = 0.5;
let filterY = 0.40;

let filterSize = 180;

let dragging = false;


/*
========================================
РАЗМЕР CANVAS
========================================
*/

function resize() {

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        innerWidth * dpr;

    canvas.height =
        innerHeight * dpr;

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/*
========================================
КАМЕРА
========================================
*/

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        message.textContent =
            "⚠️ Открой HTML через HTTPS";

        return;
    }


    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );
        }


        message.textContent =
            "Запрашиваем камеру...";


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {
                        facingMode: camera,

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    }

                });


        video.srcObject = stream;

        await video.play();


        message.textContent =
            "Камера работает";


        /*
        Пробуем встроенное
        распознавание лица
        */

        if ("FaceDetector" in window) {

            try {

                detector =
                    new FaceDetector({
                        fastMode: true,
                        maxDetectedFaces: 1
                    });

                message.textContent =
                    "Камера работает • поиск лица...";

            } catch {

                detector = null;

            }

        } else {

            detector = null;

            message.textContent =
                "Камера работает • фильтр можно двигать пальцем";
        }


        detectLoop();

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "❌ Нет доступа к камере";

        alert(
            "Разреши доступ к камере в настройках браузера.\n\n" +
            "Если HTML открыт как файл, открой его через HTTPS."
        );
    }
}


/*
========================================
РИСОВАНИЕ ФИЛЬТРА
========================================
*/

function drawFilter(x, y, size) {

    const w = size;

    const h = size * 0.72;


    ctx.save();


    /*
    Свечение
    */

    ctx.shadowColor =
        "#b800ff";

    ctx.shadowBlur =
        25;


    /*
    Фиолетовая область
    */

    const gradient =
        ctx.createLinearGradient(
            x - w / 2,
            y - h / 2,
            x + w / 2,
            y + h / 2
        );

    gradient.addColorStop(
        0,
        "#6d18a8"
    );

    gradient.addColorStop(
        .5,
        "#a52cff"
    );

    gradient.addColorStop(
        1,
        "#5e1495"
    );


    ctx.fillStyle =
        gradient;


    /*
    Скруглённая форма
    */

    roundRect(
        ctx,
        x - w / 2,
        y - h / 2,
        w,
        h,
        28
    );

    ctx.fill();


    /*
    Контур
    */

    ctx.shadowBlur = 0;

    ctx.lineWidth = 4;

    ctx.strokeStyle =
        "#dc71ff";

    ctx.stroke();


    /*
    Смайлик
    */

    ctx.font =
        `${h * .70}px Arial`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#ffd93d";

    ctx.fillText(
        "😃",
        x,
        y + 2
    );


    ctx.restore();
}


/*
========================================
СКРУГЛЁННЫЙ ПРЯМОУГОЛЬНИК
========================================
*/

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    context.beginPath();

    context.moveTo(
        x + radius,
        y
    );

    context.lineTo(
        x + width - radius,
        y
    );

    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    context.lineTo(
        x + width,
        y + height - radius
    );

    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    context.lineTo(
        x + radius,
        y + height
    );

    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    context.lineTo(
        x,
        y + radius
    );

    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    context.closePath();
}


/*
========================================
РАСПОЗНАВАНИЕ ЛИЦА
========================================
*/

async function detectLoop() {

    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    if (
        detector &&
        video.readyState >= 2
    ) {

        try {

            const faces =
                await detector.detect(video);


            if (faces.length) {

                const face =
                    faces[0].boundingBox;


                /*
                Масштаб видео
                относительно экрана
                */

                const vw =
                    video.videoWidth;

                const vh =
                    video.videoHeight;


                const scale =
                    Math.max(
                        innerWidth / vw,
                        innerHeight / vh
                    );


                const shownW =
                    vw * scale;

                const shownH =
                    vh * scale;


                const offsetX =
                    (innerWidth - shownW) / 2;

                const offsetY =
                    (innerHeight - shownH) / 2;


                let x =
                    face.x +
                    face.width / 2;


                let y =
                    face.y +
                    face.height / 2;


                x =
                    x * scale +
                    offsetX;


                y =
                    y * scale +
                    offsetY;


                /*
                Фронтальная камера
                зеркальная
                */

                if (camera === "user") {

                    x =
                        innerWidth - x;
                }


                filterX =
                    x / innerWidth;

                filterY =
                    y / innerHeight;


                filterSize =
                    Math.max(
                        120,
                        face.width *
                        scale *
                        1.45
                    );


                faceDetected = true;


                message.textContent =
                    "😃 Лицо найдено";

            }

        }

        catch (error) {

            console.log(
                "FaceDetector:",
                error
            );

        }
    }


    /*
    Всегда рисуем фильтр.
    Поэтому даже браузер без
    FaceDetector не будет
    показывать пустой экран.
    */

    drawFilter(
        innerWidth * filterX,
        innerHeight * filterY,
        filterSize
    );


    requestAnimationFrame(
        detectLoop
    );
}


/*
========================================
ПЕРЕМЕЩЕНИЕ ПАЛЬЦЕМ
========================================
*/

canvas.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        filterX =
            event.clientX /
            innerWidth;

        filterY =
            event.clientY /
            innerHeight;
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        filterX =
            event.clientX /
            innerWidth;

        filterY =
            event.clientY /
            innerHeight;
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

    }
);


/*
========================================
ПЕРЕКЛЮЧЕНИЕ КАМЕРЫ
========================================
*/

flipButton.onclick =
async function () {

    camera =
        camera === "user"
            ? "environment"
            : "user";


    video.style.transform =
        camera === "user"
            ? "scaleX(-1)"
            : "scaleX(1)";


    await startCamera();
};


/*
========================================
ЗАПУСК
========================================
*/

startButton.onclick =
    startCamera;


/*
Не запускаем камеру
автоматически — браузер
надёжнее даёт разрешение
после нажатия пользователем.
*/

message.textContent =
    "Нажми «Запустить камеру»";

</script>

</body>
</html>
